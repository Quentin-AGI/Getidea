<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇</title>
  <style>
    :root { --bg:#0f172a; --panel:#111827; --accent:#22c55e; --food:#ef4444; --text:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 20% 20%,#1e293b,#020617); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    .wrap { width:min(92vw,560px); background:color-mix(in oklab,var(--panel) 85%,black); border:1px solid #334155; border-radius:14px; padding:16px; box-shadow:0 12px 30px #0006; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
    .score { font-weight:700; }
    button { border:0; padding:8px 12px; border-radius:8px; cursor:pointer; background:#2563eb; color:#fff; font-weight:600; }
    button:hover { filter:brightness(1.1); }
    canvas { width:100%; aspect-ratio:1/1; background:#020617; border-radius:10px; border:1px solid #1f2937; }
    .tips { margin-top:10px; color:#94a3b8; font-size:13px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="score">分数：<span id="score">0</span></div>
      <button id="restart">重新开始</button>
    </div>
    <canvas id="game" width="480" height="480" aria-label="snake game"></canvas>
    <p class="tips">方向键 / WASD 控制移动，撞墙或撞到自己游戏结束。</p>
  </main>

  <script>
    const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
    const scoreEl = document.getElementById('score'), restartBtn = document.getElementById('restart');
    const N = 20, CELL = cvs.width / N, SPEED = 120;
    let snake, dir, nextDir, food, score, timer, over;

    const randCell = () => ({ x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 });
    const same = (a, b) => a.x === b.x && a.y === b.y;
    const placeFood = () => {
      do food = randCell(); while (snake.some(s => same(s, food)));
    };

    function reset() {
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir = nextDir = {x:1,y:0};
      score = 0; over = false;
      scoreEl.textContent = 0;
      placeFood();
      clearInterval(timer);
      timer = setInterval(tick, SPEED);
      draw();
    }

    function tick() {
      if (over) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= N || head.y < 0 || head.y >= N || snake.some(s => same(s, head))) {
        over = true;
        draw();
        return;
      }
      snake.unshift(head);
      if (same(head, food)) {
        scoreEl.textContent = ++score;
        placeFood();
      } else snake.pop();
      draw();
    }

    function drawCell({x, y}, color, r = 0.16) {
      const pad = CELL * r;
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    }

    function draw() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, cvs.width, cvs.height);

      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if ((i + j) % 2) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(i * CELL, j * CELL, CELL, CELL);
          }
        }
      }

      drawCell(food, '#ef4444', 0.2);
      snake.forEach((s, i) => drawCell(s, i ? '#22c55e' : '#86efac', 0.14));

      if (over) {
        ctx.fillStyle = '#000a';
        ctx.fillRect(0, 0, cvs.width, cvs.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 42px system-ui';
        ctx.fillText('游戏结束', cvs.width / 2, cvs.height / 2 - 10);
        ctx.font = '20px system-ui';
        ctx.fillText(`得分：${score}`, cvs.width / 2, cvs.height / 2 + 28);
      }
    }

    addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      const map = { arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0] };
      if (!map[key]) return;
      const [x, y] = map[key];
      if (x === -dir.x && y === -dir.y) return;
      nextDir = {x, y};
    });

    restartBtn.onclick = reset;
    reset();
  </script>
</body>
</html>
